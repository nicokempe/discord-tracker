name: Release
run-name: Release Discord tracker from ${{ github.ref_name }}

on:
  workflow_dispatch:

concurrency:
  group: discord-tracker-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  TRIVY_VERSION: v0.76.1

jobs:
  release:
    name: Release container and changelog
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Require the main branch
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo '::error::Run releases from the main branch.'
            exit 1
          fi

      - name: Checkout main and complete history
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Require the latest main commit
        run: |
          git fetch origin main
          git fetch --tags origin
          base_sha="$(git rev-parse HEAD)"
          if [[ "$base_sha" != "$(git rev-parse origin/main)" ]]; then
            echo '::error::main changed while this release was queued. Start a new run.'
            exit 1
          fi
          echo "BASE_SHA=$base_sha" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.22.1'

      - name: Set up pnpm
        run: npm install --global pnpm@12.15.0

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release tooling
        run: pnpm run release:check

      # Resolve signing dependencies before any tags or images can be published.
      - name: Install checksum-pinned Cosign with download retries
        env:
          COSIGN_VERSION: v3.1.4
          COSIGN_SHA256: 424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa
        run: bash scripts/release/install-cosign.sh

      - name: Find an incomplete release
        id: incomplete
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { readFileSync } = require('node:fs')
            const { execFileSync } = require('node:child_process')
            const version = JSON.parse(readFileSync('package.json', 'utf8')).version
            if (!/^[1-9]\d{3}\.(?:[1-9]|1[0-2])\.(?:0|[1-9]\d*)$/.test(version)) {
              throw new Error('Package version must use YYYY.M.N.')
            }
            if (!execFileSync('git', ['tag', '--list', version], { encoding: 'utf8' }).trim()) return
            try {
              const { data } = await github.rest.repos.getReleaseByTag({ ...context.repo, tag: version })
              if (!data.draft && !data.prerelease) return
            } catch (error) {
              if (error.status !== 404) throw error
            }
            core.setOutput('version', version)
            core.notice(`Resuming incomplete release ${version} from its existing tag.`)

      - name: Prepare version and changelog
        id: release
        env:
          RESUME_VERSION: ${{ steps.incomplete.outputs.version }}
        run: |
          arguments=(--github-output "$GITHUB_OUTPUT"
            --notes-file "$RUNNER_TEMP/discord-tracker-release-notes.md")
          if [[ -n "$RESUME_VERSION" ]]; then
            arguments+=(--resume-version "$RESUME_VERSION")
          fi
          pnpm run release:prepare "${arguments[@]}"

      - name: Restore the original source when resuming a release
        if: steps.release.outputs.should_commit == 'false'
        env:
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
        run: |
          git checkout --detach "$SOURCE_SHA"
          pnpm install --frozen-lockfile

      - name: Check release diff
        run: git diff --check

      - name: Type check application
        run: pnpm run typecheck

      - name: Test application and build compiled output
        run: pnpm test

      - name: Create the local release commit and tag
        if: steps.release.outputs.should_commit == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json CHANGELOG.md
          if git diff --cached --quiet; then
            echo '::error::Release preparation did not create a commit.'
            exit 1
          fi
          git commit -m "chore(release): $VERSION"
          git tag --annotate "$VERSION" --message "$VERSION"

      - name: Set immutable release metadata
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          release_sha="$(git rev-parse HEAD)"
          echo "RELEASE_SHA=$release_sha" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${release_sha:0:12}" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          artifact_directory="$RUNNER_TEMP/discord-tracker-release"
          echo "RELEASE_ARTIFACTS_DIR=$artifact_directory" >> "$GITHUB_ENV"
          mkdir -p "$artifact_directory/sbom" "$artifact_directory/reports"

      - name: Set up QEMU for ARM64
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Find an already published release image
        id: image
        env:
          SHOULD_COMMIT: ${{ steps.release.outputs.should_commit }}
        run: |
          error_path="$RUNNER_TEMP/registry-inspect-error.txt"
          if digest="$(docker buildx imagetools inspect "$IMAGE:$VERSION" \
            --format '{{.Manifest.Digest}}' 2>"$error_path")"; then
            if [[ "$SHOULD_COMMIT" == true ]]; then
              echo '::error::The new release version already has a registry image.'
              exit 1
            fi
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo '::error::Registry returned an invalid image digest.'
              exit 1
            fi
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
          elif grep -qiE 'manifest[ _]unknown' "$error_path" \
            || grep -Fq -- "$IMAGE:$VERSION: not found" "$error_path"; then
            echo 'No release image exists yet; building both platforms.'
          else
            cat "$error_path" >&2
            exit 1
          fi

      - name: Pull and validate the existing release images
        if: steps.image.outputs.digest != ''
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          index_path="$RUNNER_TEMP/release-image-index.json"
          docker buildx imagetools inspect "$IMAGE@$IMAGE_DIGEST" --raw > "$index_path"
          for architecture in amd64 arm64; do
            platform_digest="$(jq -er --arg architecture "$architecture" '
              [.manifests[] | select(.platform.os == "linux" and .platform.architecture == $architecture)]
              | if length == 1 then .[0].digest else error("Expected one platform manifest") end
            ' "$index_path")"
            [[ "$platform_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            platform_reference="$IMAGE@$platform_digest"
            docker pull --platform "linux/$architecture" "$platform_reference"
            docker image inspect "$platform_reference" | jq -e \
              --arg architecture "$architecture" --arg revision "$RELEASE_SHA" \
              --arg version "$VERSION" --arg source "https://github.com/$GITHUB_REPOSITORY" '
              .[0] | .Architecture == $architecture and .Os == "linux" and
              .Config.Labels["org.opencontainers.image.revision"] == $revision and
              .Config.Labels["org.opencontainers.image.version"] == $version and
              .Config.Labels["org.opencontainers.image.source"] == $source
            '
            docker tag "$platform_reference" "$IMAGE:sha-$SHORT_SHA-$architecture"
          done

      # Separate local images allow both platforms to be scanned before publishing.
      - name: Build AMD64 container
        if: steps.image.outputs.digest == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE }}:sha-${{ env.SHORT_SHA }}-amd64
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.RELEASE_SHA }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.licenses=MIT
          cache-from: |
            type=gha,scope=discord-tracker-amd64
            type=gha,scope=discord-tracker-validate
          cache-to: type=gha,mode=max,scope=discord-tracker-amd64

      - name: Build ARM64 container
        if: steps.image.outputs.digest == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          load: true
          push: false
          tags: ${{ env.IMAGE }}:sha-${{ env.SHORT_SHA }}-arm64
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.RELEASE_SHA }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.licenses=MIT
          cache-from: |
            type=gha,scope=discord-tracker-arm64
            type=gha,scope=discord-tracker-validate
          cache-to: type=gha,mode=max,scope=discord-tracker-arm64

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}
          path: ${{ runner.temp }}/trivy-${{ github.run_id }}-${{ github.run_attempt }}
          cache: false

      - name: Scan both images and generate CycloneDX SBOMs
        id: scan
        run: |
          for architecture in amd64 arm64; do
            image_reference="$IMAGE:sha-$SHORT_SHA-$architecture"
            trivy image --image-src docker --scanners vuln \
              --ignore-unfixed --severity CRITICAL,HIGH,MEDIUM,LOW --exit-code 0 \
              --format table --output "$RELEASE_ARTIFACTS_DIR/reports/$architecture.txt" \
              "$image_reference"
            trivy image --image-src docker --scanners vuln \
              --format cyclonedx --output "$RELEASE_ARTIFACTS_DIR/sbom/$architecture.cdx.json" \
              "$image_reference"
          done
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg commitSha "$RELEASE_SHA" \
            --arg imageName "$IMAGE" \
            --arg imageVersion "$VERSION" \
            --arg imageImmutableTag "sha-$SHORT_SHA" \
            --arg workflowRunId "$GITHUB_RUN_ID" \
            '{repository: $repository, commitSha: $commitSha, imageName: $imageName,
              imageVersion: $imageVersion, imageImmutableTag: $imageImmutableTag,
              workflowRunId: $workflowRunId, platforms: ["linux/amd64", "linux/arm64"],
              imageSbomPaths: ["amd64.cdx.json", "arm64.cdx.json"]}' \
            > "$RELEASE_ARTIFACTS_DIR/sbom/manifest.json"

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sbom-discord-tracker-${{ env.VERSION }}-${{ github.run_attempt }}
          path: ${{ env.RELEASE_ARTIFACTS_DIR }}/sbom/
          if-no-files-found: error
          retention-days: 90

      - name: Upload vulnerability reports
        if: ${{ always() && steps.scan.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: trivy-discord-tracker-${{ env.VERSION }}-${{ github.run_attempt }}
          path: ${{ env.RELEASE_ARTIFACTS_DIR }}/reports/
          if-no-files-found: ignore
          retention-days: 90

      - name: Publish the release commit and tag atomically
        env:
          SHOULD_COMMIT: ${{ steps.release.outputs.should_commit }}
        run: |
          git fetch origin main
          git fetch --tags origin
          if [[ "$BASE_SHA" != "$(git rev-parse origin/main)" ]]; then
            echo '::error::main changed during validation. Start a new run.'
            exit 1
          fi
          if [[ "$SHOULD_COMMIT" == true ]]; then
            git push --atomic origin HEAD:refs/heads/main "refs/tags/$VERSION"
          elif [[ "$(git rev-parse "refs/tags/$VERSION^{commit}")" != "$RELEASE_SHA" ]]; then
            echo '::error::The existing tag does not match the release source.'
            exit 1
          fi

      - name: Publish scanned images or reuse the existing manifest
        id: manifest
        env:
          EXISTING_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          digest="$EXISTING_DIGEST"
          if [[ -z "$digest" ]]; then
            docker push "$IMAGE:sha-$SHORT_SHA-amd64"
            docker push "$IMAGE:sha-$SHORT_SHA-arm64"
            docker buildx imagetools create \
              --tag "$IMAGE:$VERSION" --tag "$IMAGE:sha-$SHORT_SHA" \
              "$IMAGE:sha-$SHORT_SHA-amd64" "$IMAGE:sha-$SHORT_SHA-arm64"
            digest="$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{.Manifest.Digest}}')"
          fi
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo '::error::Registry returned an invalid image digest.'
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Sign the release manifest by digest
        env:
          IMAGE_DIGEST: ${{ steps.manifest.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$IMAGE_DIGEST"

      - name: Promote signed image to latest and main
        env:
          IMAGE_DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:latest" --tag "$IMAGE:main" "$IMAGE@$IMAGE_DIGEST"
          for alias in latest main; do
            [[ "$(docker buildx imagetools inspect "$IMAGE:$alias" --format '{{.Manifest.Digest}}')" == "$IMAGE_DIGEST" ]]
          done

      - name: Create or update GitHub Release
        uses: actions/github-script@v9
        env:
          RELEASE_NOTES_PATH: ${{ steps.release.outputs.release_notes_path }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { readFileSync } = require('node:fs')
            const version = process.env.VERSION
            const notesPath = process.env.RELEASE_NOTES_PATH
            if (!version || !notesPath) {
              throw new Error('Release version and notes path are required.')
            }
            const parameters = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: version,
              name: version,
              body: readFileSync(notesPath, 'utf8'),
              draft: false,
              prerelease: false,
              make_latest: 'true',
            }
            let existingRelease
            try {
              existingRelease = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: version,
              })
            } catch (error) {
              if (error.status !== 404) throw error
            }
            if (existingRelease) {
              await github.rest.repos.updateRelease({
                ...parameters,
                release_id: existingRelease.data.id,
              })
            } else {
              await github.rest.repos.createRelease(parameters)
            }
