name: Release
run-name: Release Discord tracker from ${{ github.ref_name }}

on:
  workflow_dispatch:

concurrency:
  group: discord-tracker-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  TRIVY_VERSION: v0.76.1

jobs:
  prepare:
    name: Prepare or resume release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    outputs:
      ready_to_publish: ${{ steps.release.outputs.ready_to_publish }}
      version: ${{ steps.release.outputs.version }}
      release_sha: ${{ steps.source.outputs.sha }}

    steps:
      - name: Require the main branch
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo '::error::Run releases from the main branch.'
            exit 1
          fi

      - name: Checkout main and complete history
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Require the latest main commit
        id: source
        run: |
          git fetch origin main
          git fetch --tags origin
          base_sha="$(git rev-parse HEAD)"
          if [[ "$base_sha" != "$(git rev-parse origin/main)" ]]; then
            echo '::error::main changed while this release was queued. Start a new run.'
            exit 1
          fi
          echo "BASE_SHA=$base_sha" >> "$GITHUB_ENV"
          echo "sha=$base_sha" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.22.1'

      - name: Set up pnpm
        run: npm install --global pnpm@12.15.0

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release tooling
        run: pnpm run release:check

      - name: Prepare version and changelog
        id: release
        run: |
          pnpm run release:prepare \
            --github-output "$GITHUB_OUTPUT" \
            --notes-file "$RUNNER_TEMP/discord-tracker-release-notes.md"

      - name: Check release diff
        run: git diff --check

      - name: Type check application
        run: pnpm run typecheck

      - name: Test application and build compiled output
        run: pnpm test

      - name: Push release preparation to its managed branch
        if: steps.release.outputs.should_commit == 'true'
        id: branch
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          git fetch origin main
          if [[ "$BASE_SHA" != "$(git rev-parse origin/main)" ]]; then
            echo '::error::main changed during preparation. Start a new run.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json CHANGELOG.md scripts/release/pending.json
          git commit -m "chore(release): $VERSION"
          branch="release/$VERSION"
          expected_sha="$(git ls-remote origin "refs/heads/$branch" | cut -f1)"
          git push --force-with-lease="refs/heads/$branch:$expected_sha" \
            origin "HEAD:refs/heads/$branch"
          echo "name=$branch" >> "$GITHUB_OUTPUT"

      - name: Open or update the release pull request
        if: steps.release.outputs.should_commit == 'true'
        uses: actions/github-script@v9
        env:
          VERSION: ${{ steps.release.outputs.version }}
          RELEASE_BRANCH: ${{ steps.branch.outputs.name }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const version = process.env.VERSION
            const branch = process.env.RELEASE_BRANCH
            const { owner, repo } = context.repo
            const body = `Prepare calendar release ${version}.\n\nMerge this pull request after its checks pass, then run **Actions → Release** on main again to publish the reviewed commit. If GitHub requests workflow approval, select **Approve workflows to run** first.`
            let pullRequest
            try {
              const existing = await github.rest.pulls.list({
                owner, repo, state: 'open', base: 'main', head: `${owner}:${branch}`,
              })
              const parameters = { owner, repo, title: `chore(release): ${version}`, body }
              pullRequest = existing.data.length > 0
                ? await github.rest.pulls.update({ ...parameters, pull_number: existing.data[0].number })
                : await github.rest.pulls.create({ ...parameters, head: branch, base: 'main' })
            } catch (error) {
              if (error.status !== 403) throw error
              const compareUrl = `https://github.com/${owner}/${repo}/compare/main...${branch}?expand=1`
              core.warning('Release branch is ready. GitHub denied PR creation; open the PR manually or enable Actions PR creation in repository settings.')
              await core.summary.addHeading(`Release ${version} prepared`)
                .addRaw('Publishing is paused until the release files are merged. ')
                .addLink('Open the release pull request', compareUrl).write()
              return
            }
            await core.summary.addHeading(`Release ${version} prepared`)
              .addLink('Review and merge the release pull request', pullRequest.data.html_url)
              .addRaw('\n\nAfter merging, start a new Release run on main to publish.').write()

      - name: Share notes for the reviewed release
        if: steps.release.outputs.ready_to_publish == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-notes-${{ github.run_id }}
          path: ${{ runner.temp }}/discord-tracker-release-notes.md
          overwrite: true
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish reviewed release
    needs: prepare
    if: needs.prepare.outputs.ready_to_publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
      id-token: write
    env:
      BASE_SHA: ${{ needs.prepare.outputs.release_sha }}

    steps:
      - name: Checkout the reviewed release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          fetch-depth: 0

      - name: Download reviewed release notes
        uses: actions/download-artifact@v8
        with:
          name: release-notes-${{ github.run_id }}
          path: ${{ runner.temp }}/discord-tracker-release-notes

      - name: Set immutable release metadata
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          release_sha="$(git rev-parse HEAD)"
          echo "RELEASE_SHA=$release_sha" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${release_sha:0:12}" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          artifact_directory="$RUNNER_TEMP/discord-tracker-release"
          echo "RELEASE_ARTIFACTS_DIR=$artifact_directory" >> "$GITHUB_ENV"
          mkdir -p "$artifact_directory/sbom" "$artifact_directory/reports"

      - name: Set up QEMU for ARM64
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Separate local images allow both platforms to be scanned before publishing.
      - name: Build AMD64 container
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.IMAGE }}:sha-${{ env.SHORT_SHA }}-amd64
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.RELEASE_SHA }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.licenses=MIT
          cache-from: |
            type=gha,scope=discord-tracker-amd64
            type=gha,scope=discord-tracker-validate
          cache-to: type=gha,mode=max,scope=discord-tracker-amd64

      - name: Build ARM64 container
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          load: true
          push: false
          tags: ${{ env.IMAGE }}:sha-${{ env.SHORT_SHA }}-arm64
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.RELEASE_SHA }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.licenses=MIT
          cache-from: |
            type=gha,scope=discord-tracker-arm64
            type=gha,scope=discord-tracker-validate
          cache-to: type=gha,mode=max,scope=discord-tracker-arm64

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}
          path: ${{ runner.temp }}/trivy-${{ github.run_id }}-${{ github.run_attempt }}
          cache: false

      - name: Scan both images and generate CycloneDX SBOMs
        id: scan
        run: |
          for architecture in amd64 arm64; do
            image_reference="$IMAGE:sha-$SHORT_SHA-$architecture"
            trivy image --image-src docker --scanners vuln \
              --ignore-unfixed --severity CRITICAL,HIGH,MEDIUM,LOW --exit-code 0 \
              --format table --output "$RELEASE_ARTIFACTS_DIR/reports/$architecture.txt" \
              "$image_reference"
            trivy image --image-src docker --scanners vuln \
              --format cyclonedx --output "$RELEASE_ARTIFACTS_DIR/sbom/$architecture.cdx.json" \
              "$image_reference"
          done
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg commitSha "$RELEASE_SHA" \
            --arg imageName "$IMAGE" \
            --arg imageVersion "$VERSION" \
            --arg imageImmutableTag "sha-$SHORT_SHA" \
            --arg workflowRunId "$GITHUB_RUN_ID" \
            '{repository: $repository, commitSha: $commitSha, imageName: $imageName,
              imageVersion: $imageVersion, imageImmutableTag: $imageImmutableTag,
              workflowRunId: $workflowRunId, platforms: ["linux/amd64", "linux/arm64"],
              imageSbomPaths: ["amd64.cdx.json", "arm64.cdx.json"]}' \
            > "$RELEASE_ARTIFACTS_DIR/sbom/manifest.json"

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sbom-discord-tracker-${{ env.VERSION }}-${{ github.run_attempt }}
          path: ${{ env.RELEASE_ARTIFACTS_DIR }}/sbom/
          if-no-files-found: error
          retention-days: 90

      - name: Upload vulnerability reports
        if: ${{ always() && steps.scan.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: trivy-discord-tracker-${{ env.VERSION }}-${{ github.run_attempt }}
          path: ${{ env.RELEASE_ARTIFACTS_DIR }}/reports/
          if-no-files-found: ignore
          retention-days: 90

      - name: Publish the release tag on the reviewed main commit
        run: |
          git fetch origin main
          git fetch --tags origin
          if [[ "$BASE_SHA" != "$(git rev-parse origin/main)" ]]; then
            echo '::error::main changed during validation. Start a new run.'
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/$VERSION"; then
            if [[ "$(git rev-parse "$VERSION^{commit}")" != "$BASE_SHA" ]]; then
              echo '::error::The release tag points to a different commit.'
              exit 1
            fi
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag --annotate "$VERSION" --message "$VERSION"
            git push origin "refs/tags/$VERSION"
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push scanned images and assemble the release manifest
        id: manifest
        run: |
          docker push "$IMAGE:sha-$SHORT_SHA-amd64"
          docker push "$IMAGE:sha-$SHORT_SHA-arm64"
          docker buildx imagetools create \
            --tag "$IMAGE:$VERSION" --tag "$IMAGE:sha-$SHORT_SHA" \
            "$IMAGE:sha-$SHORT_SHA-amd64" "$IMAGE:sha-$SHORT_SHA-arm64"
          digest="$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{.Manifest.Digest}}')"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo '::error::Registry returned an invalid image digest.'
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
          install-dir: ${{ runner.temp }}/cosign-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Sign the release manifest by digest
        env:
          IMAGE_DIGEST: ${{ steps.manifest.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$IMAGE_DIGEST"

      - name: Promote signed image to latest and main
        env:
          IMAGE_DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:latest" --tag "$IMAGE:main" "$IMAGE@$IMAGE_DIGEST"

      - name: Create or update GitHub Release
        uses: actions/github-script@v9
        env:
          RELEASE_NOTES_PATH: ${{ runner.temp }}/discord-tracker-release-notes/discord-tracker-release-notes.md
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { readFileSync } = require('node:fs')
            const version = process.env.VERSION
            const notesPath = process.env.RELEASE_NOTES_PATH
            if (!version || !notesPath) {
              throw new Error('Release version and notes path are required.')
            }
            const parameters = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: version,
              name: version,
              body: readFileSync(notesPath, 'utf8'),
              draft: false,
              prerelease: false,
            }
            let existingRelease
            try {
              existingRelease = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: version,
              })
            } catch (error) {
              if (error.status !== 404) throw error
            }
            if (existingRelease) {
              await github.rest.repos.updateRelease({
                ...parameters,
                release_id: existingRelease.data.id,
              })
            } else {
              await github.rest.repos.createRelease(parameters)
            }
