name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: discord-tracker-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate application and container
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.22.1'

      - name: Set up pnpm
        run: npm install --global pnpm@12.15.0

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release tooling
        run: pnpm run release:check

      - name: Type check application
        run: pnpm run typecheck

      - name: Test application and health probe
        run: pnpm test

      - name: Set up QEMU for ARM64
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build both container platforms
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: |
            type=gha,scope=discord-tracker-amd64
            type=gha,scope=discord-tracker-arm64
          cache-to: type=gha,mode=max,scope=discord-tracker-validate
